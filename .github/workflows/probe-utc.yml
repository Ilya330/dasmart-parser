# ВРЕМЕННАЯ проба планировщика (28.09.2026): срабатывает ли cron
# с timezone "UTC". Удалить после диагностики.
name: Probe schedule (utc)

on:
  schedule:
    - cron: "3-59/5 * * * *"
      timezone: "UTC"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule='${{ github.event.schedule }}' started $(date -u +%H:%M:%S) UTC"
