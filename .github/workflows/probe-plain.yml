# ВРЕМЕННАЯ проба планировщика (28.09.2026): срабатывает ли cron
# без timezone. Удалить после диагностики.
name: Probe schedule (plain)

on:
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule='${{ github.event.schedule }}' started $(date -u +%H:%M:%S) UTC"
