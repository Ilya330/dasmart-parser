name: Update feed

on:
  schedule:
    # 5 раз в сутки: 06 / 10 / 14 / 18 / 22 по Киеву. cron здесь по UTC, а Киев
    # летом UTC+3, зимой UTC+2 — поэтому два набора часов, лишний отсекает
    # джоб gate. (С ключом timezone: "Europe/Kyiv" 28.09.2026 за 7 часов не было
    # ни одного планового запуска.)
    - cron: "0 3,7,11,15,19 * * *"   # летнее время Киева (UTC+3)
    - cron: "0 4,8,12,16,20 * * *"   # зимнее время Киева (UTC+2)
  workflow_dispatch: {}        # ручной запуск кнопкой в Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Пропускает запуск из «чужого» набора часов: летнего зимой и наоборот.
  # Ручной запуск проходит всегда.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      run: ${{ steps.kyiv.outputs.run }}
    steps:
      - id: kyiv
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "0 3,7,11,15,19 * * *") want=+0300 ;;
            "0 4,8,12,16,20 * * *") want=+0200 ;;
            *) want="" ;;
          esac
          now=$(TZ=Europe/Kyiv date +%z)
          if [ -z "$want" ] || [ "$now" = "$want" ]; then run=true; else run=false; fi
          echo "расписание «$SCHEDULE», Киев сейчас UTC$now -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # BackOffHTTPClient в run.py повторяет 5xx от Google без ограничения
    # числа попыток — долгий сбой Google не должен висеть 6 часов
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Build feed + update Google Sheet
        run: python run.py

      # Фид публикуется, если собран, — даже когда упала запись в таблицу
      # (run.py собирает feed.xml до неё; в репо его нет, он в .gitignore).
      # Джоб при этом остаётся красным, письмо о сбое придёт.
      - if: ${{ !cancelled() && hashFiles('public/feed.xml') != '' }}
        uses: actions/configure-pages@v6
      - if: ${{ !cancelled() && hashFiles('public/feed.xml') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        if: ${{ !cancelled() && hashFiles('public/feed.xml') != '' }}
        uses: actions/deploy-pages@v5

  # GitHub отключает cron в публичном репозитории после 60 дней без коммитов —
  # так фид и замёрз 24.08.2026. После 50 дней тишины — пустой коммит,
  # в остальных прогонах джоб только печатает возраст последнего коммита.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Empty commit after 50 days without commits
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "последний коммит: $days дн. назад"
          if [ "$days" -lt 50 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $days дн. без коммитов, иначе GitHub отключит расписание"
          git push
